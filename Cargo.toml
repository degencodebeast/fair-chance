[workspace]
resolver = "2"
members = ["rule-engine", "contracts/coin", "contracts/factory", "sandbox-tests"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
borsh = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
near-sdk = "5.30.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
