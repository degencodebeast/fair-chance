[package]
name = "fair-chance-sandbox-tests"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Fair Chance sandbox tests and the walking-path runner."

[dependencies]
anyhow = "1"
rule_engine = { package = "fair-chance-rule-engine", path = "../rule-engine" }
near-api = "0.8.7"
# The chunk reads that find a launch transaction on chain; near-api has no chunk call. Already in
# the lock through near-api.
near-openapi-client = "0.8.0"
near-sandbox = { version = "0.3.16", features = ["generate"] }
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "signal", "sync"] }

[dev-dependencies]
ethnum = "1"
# The sandbox test reads the actions of a recorded signed send. Both already in the lock through
# near-api-types, at these versions; no new crate.
base64 = "0.22.1"
borsh = "1.8.1"
# The fake RPC in tests/common: a local TCP server. Features only; no new crate.
tokio = { version = "1", features = ["net", "io-util"] }

[features]
# The Option T testnet path reads the funder key from the system keychain (near-api keystore, the
# keyring crate). Off by default, so the sandbox scripts and tests never build keyring. Only this
# test crate uses near-api; the coin and factory contracts do not depend on it.
testnet-keychain = ["near-api/keystore"]
