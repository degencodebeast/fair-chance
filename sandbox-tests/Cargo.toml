[package]
name = "fair-chance-sandbox-tests"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Fair Chance sandbox tests and the walking-path runner."

[dependencies]
anyhow = "1"
near-api = "0.8.7"
near-sandbox = { version = "0.3.16", features = ["generate"] }
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "signal"] }
