[package]
name = "fair-chance-coin"
# The coin's package version is the coin interface version (INTERFACE.md); NEP-330 reports it.
version = "1.0.0-rc.6"
edition.workspace = true
license.workspace = true
repository = "https://github.com/degencodebeast/fair-chance"
description = "Fair Chance coin: NEP-141 token and its own pool, with sell limits."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rule_engine = { package = "fair-chance-rule-engine", path = "../../rule-engine" }
near-sdk.workspace = true
serde_json.workspace = true

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }

# Reproducible build (`scripts/build-coin-reproducible.sh`, cargo-near `reproducible-wasm`).
# The image pins cargo-near 0.22.0 and Rust 1.97.1 (equal to rust-toolchain.toml) by digest.
# `--no-abi` because the engine view types do not derive JsonSchema.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.97.1"
image_digest = "sha256:7467038bdddc86484b73b416eeadce926ff59013e128e53dec5a19e1cb4b2234"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked", "--no-abi"]
