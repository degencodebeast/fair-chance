[package]
name = "fair-chance-factory"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository = "https://github.com/degencodebeast/fair-chance"
description = "Fair Chance factory: launches coins that use one global contract by code hash."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true, features = ["global-contracts"] }
serde_json.workspace = true

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing", "global-contracts"] }
